<VirtualHost *:80>
    ServerName soufianeazerdaoui.me

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    ProxyPass / http://127.0.0.1:3100/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:3100/

    ErrorLog ${APACHE_LOG_DIR}/soufianeazerdaoui-error.log
    CustomLog ${APACHE_LOG_DIR}/soufianeazerdaoui-access.log combined
</VirtualHost>
